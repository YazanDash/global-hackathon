[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "budgetdev"
version = "0.1.0"
description = "A token-efficient baseline coding agent."
requires-python = ">=3.11"
dependencies = [
  "typer",
  "pydantic",
  "python-dotenv",
  "openai",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock"]

[project.scripts]
budgetdev = "budgetdev.cli:app"

[tool.setuptools.packages.find]
include = ["budgetdev*"]
